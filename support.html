<!doctype html>
<html lang="en" data-launch="%VITE_LAUNCH_MODE%" style="--header-bg: 1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support · Reembr</title>
    <meta name="description" content="Get help with Reembr. Contact support by email." />
    <link rel="canonical" href="https://reembr.app/support" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fbf8f3" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:site_name" content="Reembr" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reembr.app/support" />
    <meta property="og:title" content="Support · Reembr" />
    <meta property="og:description" content="Get help with Reembr. Contact support by email." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
    <style>
      .legal-main { max-width: 720px; margin: 0 auto; padding: clamp(120px, 16vh, 160px) clamp(20px, 5vw, 24px) 100px; }
      .legal-main h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.1rem, 5vw, 2.8rem); letter-spacing: -0.03em; margin-bottom: 6px; }
      .legal-back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; font-weight: 600; margin-bottom: 28px; }
      .legal-back:hover { color: var(--brand); }
      .support-email { display: inline-block; margin-top: 20px; font-family: var(--display); font-weight: 700; font-size: clamp(1.1rem, 3vw, 1.4rem); color: var(--brand); }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="/" aria-label="Reembr home">
        <img class="site-logo__mark" src="./logo.svg" alt="" width="31" height="30" />
        <span class="site-logo__word">reembr</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/#how">How it works</a>
        <a href="/#try">Try it</a>
        <a href="/#privacy">Privacy</a>
      </nav>
      <a class="site-header__button" href="/#download">
        <span>Get the app</span>
      </a>
    </header>

    <main class="legal-main">
      <a class="legal-back" href="/">&larr; Back to reembr.app</a>
      <h1>Support</h1>
      <div class="policy">
        <p>Need help with Reembr, have a question, or found a bug? Reach us directly by email and we&rsquo;ll get back to you.</p>
        <a class="support-email" href="mailto:support@reembr.app">support@reembr.app</a>
      </div>
    </main>

    <footer class="footer">
      <a class="site-logo" href="/" aria-label="Reembr home">
        <img class="site-logo__mark" src="./logo.svg" alt="" width="27" height="26" />
        <span class="site-logo__word">reembr</span>
      </a>
      <p>For everyone who has ever done the doorway pat-down. &copy; 2026 Reembr.</p>
      <nav aria-label="Footer">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </nav>
    </footer>
  </body>
</html>
